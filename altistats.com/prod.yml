name: altistats

x-db-env: &db-env
  POSTGRES_USER: root
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: altistats
  POSTGRES_HOST: pg
  POSTGRES_PORT: 5432

x-bot-base: &bot-base
  image: magneticduck/botclient:0.3.1
  deploy:
    mode: global
  volumes:
    - /root/alti_home:/app
  restart: unless-stopped

services:
  nginx:
    build: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/alti_home/recordings/:/usr/share/nginx/recordings/
      - /root/files/:/usr/share/nginx/files/
      - /root/letsencrypt/:/etc/letsencrypt/:ro
      - /root/certbot-www/:/var/www/certbot/:ro
    # Reload periodically to pick up renewed certificates.
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      - ntfy
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - /root/letsencrypt/:/etc/letsencrypt/
      - /root/certbot-www/:/var/www/certbot/
    entrypoint: /bin/sh -c 'while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done'
    restart: unless-stopped

  stats_db:
    image: magneticduck/stats_db:latest
    volumes:
      - /root/alti_home/recordings:/app/recordings:ro
      - /root/stats_db/:/app/stats_db/
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 2G
    environment:
      REPLAY_DIR: /app/recordings/
      STATS_DB: /app/stats_db/stats.db
      STATS_INTERVAL: 10
    restart: unless-stopped

  site:
    image: magneticduck/altistats:latest
    volumes:
      - /root/stats_db/:/app/stats_db/
    environment:
      <<: *db-env
      STATS_DB: /app/stats_db/stats.db
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

  listing-bot:
    <<: *bot-base
    environment:
      BOT_CONFIG: /app/client_configs/get_listings.xml
      ALTI_HOME: /app
      <<: *db-env
    depends_on:
      - pg

  notifier:
    build: notifier
    environment:
      <<: *db-env

      NTFY_URL: http://ntfy
    volumes:
      - /root/notifier/:/app/state/
    depends_on:
      - pg
      - ntfy
    restart: unless-stopped

  spec-bot-1:
    <<: *bot-base
    environment:
      BOT_CONFIG: /app/client_configs/spectate_ladder_1.xml
      JAVA_OPTS: -Xmx512m
      ALTI_HOME: /app

  spec-bot-2:
    <<: *bot-base
    environment:
      BOT_CONFIG: /app/client_configs/spectate_ladder_2.xml
      JAVA_OPTS: -Xmx512m
      ALTI_HOME: /app

  spec-bot-3:
    <<: *bot-base
    environment:
      BOT_CONFIG: /app/client_configs/spectate_ladder_3.xml
      JAVA_OPTS: -Xmx512m
      ALTI_HOME: /app

  spec-bot-4:
    <<: *bot-base
    environment:
      BOT_CONFIG: /app/client_configs/spectate_ladder_4.xml
      JAVA_OPTS: -Xmx512m
      ALTI_HOME: /app

  spec-bot-5:
    <<: *bot-base
    environment:
      BOT_CONFIG: /app/client_configs/spectate_ladder_5.xml
      JAVA_OPTS: -Xmx512m
      ALTI_HOME: /app

  # spec-bot-6:
  #   <<: *bot-base
  #   environment:
  #     BOT_CONFIG: /app/client_configs/spectate_ladder_6.xml
  #     JAVA_OPTS: -Xmx512m
  #     ALTI_HOME: /app

  pg:
    image: postgres:15
    deploy:
      mode: global
    environment:
      <<: *db-env
    volumes:
      - /root/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    command:
      - serve
    environment:
      - TZ=UTC
    volumes:
      - /root/ntfy_cache:/var/cache/ntfy
      - /root/ntfy_config:/etc/ntfy
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true

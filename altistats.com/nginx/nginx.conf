# Plain HTTP: ACME challenges for certbot, everything else redirects to HTTPS.
server {
    listen 80;
    server_name altistats.com ntfy.altistats.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name altistats.com;

    ssl_certificate /etc/letsencrypt/live/altistats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altistats.com/privkey.pem;

    # recording files
    location /recordings {
        alias /usr/share/nginx/recordings/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # recording files
    location /files {
        alias /usr/share/nginx/files/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # static assets for replay viewer
    location /viewer {
        alias /usr/share/nginx/html/viewer;
    }

    # site
    location / {
        proxy_pass http://site:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript image/*;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}

# ntfy config adapted from https://docs.ntfy.sh/config/#__tabbed_16_1
# (port 80 is handled by the redirect block at the top of this file)
server {
    listen 443 ssl;
    http2 on;
    server_name ntfy.altistats.com;

    ssl_certificate /etc/letsencrypt/live/altistats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altistats.com/privkey.pem;

    location / {
        proxy_pass http://ntfy:80;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;

        client_max_body_size 0; # Stream request body to backend
    }
}
